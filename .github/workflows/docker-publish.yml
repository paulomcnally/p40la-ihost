name: Build & Push Docker Image

on:
  push:
    tags: ["v*"]

env:
  IMAGE_NAME: paulomcnally/p40la-ihost

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
        include:
          - platform: linux/amd64
            tag_suffix: amd64
          - platform: linux/arm/v7
            tag_suffix: armv7
          - platform: linux/arm64
            tag_suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.tag_suffix }}
          cache-to: type=gha,scope=${{ matrix.tag_suffix }},mode=max

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-armv7 \
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64
