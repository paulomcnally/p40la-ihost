name: Build & Push MCP Image

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del MCP (X.Y.Z)"
        required: true
        default: "0.1.0"

env:
  IMAGE_NAME: paulomcnally/p40la-mcp
  TAILSCALE_IMAGE: paulomcnally/p40la-mcp-tailscale

jobs:
  build:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
        include:
          - platform: linux/amd64
            tag_suffix: amd64
            runs_on: ubuntu-latest
            needs_qemu: "false"
          - platform: linux/arm/v7
            tag_suffix: armv7
            runs_on: ubuntu-latest
            needs_qemu: "true"
          - platform: linux/arm64
            tag_suffix: arm64
            runs_on: ubuntu-24.04-arm
            needs_qemu: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/mcp-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/mcp-v}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.needs_qemu == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          platforms: ${{ matrix.platform }}
          push: true
          load: false
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=mcp-${{ matrix.tag_suffix }}
          cache-to: type=gha,scope=mcp-${{ matrix.tag_suffix }},mode=max
          provenance: false
          secrets: |
            gh_token=${{ secrets.P40LA_PLUGINS_TOKEN }}

  build-tailscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/mcp-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/mcp-v}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Tailscale wrapper
        uses: docker/build-push-action@v7
        with:
          context: deploy/mcp/tailscale
          file: deploy/mcp/tailscale/Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
            ${{ env.TAILSCALE_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.TAILSCALE_IMAGE }}:latest
          provenance: false

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/mcp-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/mcp-v}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wait and verify platform images
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          for attempt in 1 2 3 4 5 6; do
            amd64=$(docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${TAG}-amd64" 2>&1 | grep -c "Manifest" || true)
            armv7=$(docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${TAG}-armv7" 2>&1 | grep -c "Manifest" || true)
            arm64=$(docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${TAG}-arm64" 2>&1 | grep -c "Manifest" || true)
            echo "intento ${attempt}: amd64=${amd64} armv7=${armv7} arm64=${arm64}"
            if [ "$amd64" -gt 0 ] && [ "$armv7" -gt 0 ] && [ "$arm64" -gt 0 ]; then
              break
            fi
            sleep 15
          done

      - name: Create multi-arch manifest
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:${TAG}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            "${{ env.IMAGE_NAME }}:${TAG}-amd64" \
            "${{ env.IMAGE_NAME }}:${TAG}-armv7" \
            "${{ env.IMAGE_NAME }}:${TAG}-arm64"

      - name: Verify manifests
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${TAG}"
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:latest"
